url: https://dmetar.protectlab.org

template:
  bootstrap: 5
  light-switch: true
  math-rendering: mathjax
  theme: arrow-light
  theme-dark: arrow-dark
  bslib:
    base_font: {google: "Fira Sans"}
    heading_font: {google: "Fira Sans"}
    code_font: {google: "Fira Code"}
    primary: "#3382b2"
    bg: "#fffefa"
    fg: "#1b1b1b"
    navbar-bg: "#3382b2"
    navbar-light-bg: "#3382b2"
    navbar-dark-bg: "#3382b2"

navbar:
  bg: primary
  type: dark
  left:
  - text: Get Started
    href: articles/dmetar.html
  - text: Documentation
    href: reference/index.html
  - text: Book
    href: https://doing-meta.guide/

